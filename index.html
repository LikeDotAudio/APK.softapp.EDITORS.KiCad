<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiCad Netlist Generator — APK.audio</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="./vendor/apk-table/apk-table.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .workspace {
      display: grid;
      grid-template-columns: 1fr 300px;
      flex: 1;
      overflow: hidden;
    }
    .panel-right {
      background: var(--osc-bg-surface);
      border-left: 1px solid var(--osc-border-default);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--osc-text-muted);
      border-bottom: 1px solid var(--osc-border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-body {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }
    .canvas-viewport {
      background: var(--osc-bg-base);
      overflow: auto;
      display: flex;
      padding: 20px;
    }
    .netlist-viewport {
      background: var(--osc-bg-input);
      padding: 20px;
      overflow: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.6;
      color: var(--osc-accent-secondary);
      white-space: pre;
    }
    .toolbar-bar {
      height: 36px;
      background: var(--osc-bg-surface);
      border-bottom: 1px solid var(--osc-border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }
  </style>
</head>
<body>
  <header class="app-window-header">
    <div class="window-title-group">
      <div class="window-dot" style="background: #38BDF8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);"></div>
      <span class="window-title">KiCad Netlist Generator</span>
      <span class="window-pill" id="block-tag" style="color: #38BDF8;">EDA / PCB NETLIST</span>
    </div>
    <div class="window-actions">
      <button class="btn btn-secondary btn-sm" id="btn-open-block">📂 Open Block</button>
      <button class="btn btn-secondary btn-sm" id="btn-discovered">⚡ Discovered</button>
      <button class="btn btn-secondary btn-sm" id="btn-download-netlist">📥 Download .net</button>
      <button class="btn btn-primary btn-sm" id="btn-save-block">💾 Save & Return</button>
      <button class="btn btn-icon btn-sm" id="btn-close" title="Close Window">✕</button>
    </div>
  </header>

  <!-- What the bus knows (APKSoftapp.discovered): identity is MAC / serial, state good / kinda / dead. -->
  <section id="discovered-panel" hidden style="max-height: 40vh; overflow: auto; padding: 8px 14px; border-bottom: 1px solid var(--osc-border-default); background: var(--osc-bg-surface);">
    <div id="discovered-status" role="status" style="font-size: 11px; color: var(--osc-text-muted); margin-bottom: 6px;"></div>
    <div id="discovered-table"></div>
  </section>

  <div class="toolbar-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="btn btn-primary btn-sm" id="tab-schematic">📐 Schematic IC Blocks</button>
      <button class="btn btn-secondary btn-sm" id="tab-netlist">📄 KiCad S-Expr Netlist</button>
      <button class="btn btn-secondary btn-sm" id="btn-add-comp">➕ Add Component</button>
    </div>
    <div id="telemetry-metrics"></div>
  </div>

  <div class="workspace">
    <!-- Center Schematic or Netlist View -->
    <main class="canvas-viewport" id="canvas-wrapper">
      <!-- KiCad SVG dynamically rendered here -->
    </main>
    <div class="netlist-viewport" id="netlist-preview-wrapper" style="display: none;">
      <pre id="netlist-pre"></pre>
    </div>

    <!-- Right Inspector -->
    <aside class="panel-right">
      <div class="panel-header">
        <span>COMPONENT & PINS</span>
      </div>
      <div class="panel-body" id="inspector-content">
        <!-- Component & pin connections rendered dynamically -->
      </div>
    </aside>
  </div>

  <script src="./vendor/apk-contracts/apk-contracts.global.js"></script>
  <script src="/FrontEnd/shared/apk-bus.js"></script>
  <script src="./vendor/apk-softapp/apk-softapp.js"></script>
  <script src="./vendor/apk-table/apk-table.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
